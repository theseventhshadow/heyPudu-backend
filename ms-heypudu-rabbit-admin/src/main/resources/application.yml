server:
  port: 8085

spring:
  application:
    name: ms-heypudu-rabbit-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:heypudu}
    password: ${RABBITMQ_PASSWORD:devpassword}
    virtual-host: ${RABBITMQ_VHOST:/}
    dynamic: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.heypudu.ms_rabbit_admin: INFO
    org.springframework.security: INFO
