spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heypudu?currentSchema=heypudu_posts}
    username: ${DB_USERNAME:heypudu_posts_user}
    password: ${DB_PASSWORD:devpassword}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID/.well-known/jwks.json

clients:
  users:
    base-url: ${CLIENTS_USERS_BASE_URL:http://localhost:8082}
  interactions:
    base-url: ${CLIENTS_INTERACTIONS_BASE_URL:http://localhost:8084}

aws:
  s3:
    region: us-east-1
    audio-bucket: heypudu-audio-dev
    covers-bucket: heypudu-covers-dev

logging:
  level:
    root: INFO
    com.heypudu.ms_posts: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.web.client: DEBUG
    software.amazon.awssdk: INFO

management:
  endpoint:
    health:
      show-details: always