server:
  port: 8087

spring:
  application:
    name: ms-analytics

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI}
          jwk-set-uri: ${COGNITO_JWK_SET_URI}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heypudu?currentSchema=heypudu_analytics}
    username: ${DB_USERNAME:heypudu_analytics_user}
    password: ${DB_PASSWORD:devpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: heypudu_analytics
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: heypudu_analytics
    default-schema: heypudu_analytics

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:live-analytics-group}

live:
  events:
    topic: ${KAFKA_TOPIC_LIVE_EVENTS:heypudu.live.events}
  audit:
    group-id: ${KAFKA_AUDIT_GROUP:live-audit-group}

posts:
  events:
    topic: ${KAFKA_TOPIC_POSTS_EVENTS:heypudu.posts.events}
  analytics:
    group-id: ${KAFKA_POSTS_GROUP:posts-analytics-group}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: INFO
    com.heypudu.ms_analytics: DEBUG
