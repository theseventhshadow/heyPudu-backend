spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/heypudu?currentSchema=heypudu_auth
    username: heypudu_auth_user
    password: devpassword
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID/.well-known/jwks.json

clients:
  users:
    base-url: http://localhost:8082

aws:
  cognito:
    region: us-east-1
    user-pool-id: us-east-1_DEVPOOLID

logging:
  level:
    root: INFO
    com.heypudu.ms_auth: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.web.client: DEBUG
    software.amazon.awssdk: INFO

management:
  endpoint:
    health:
      show-details: always