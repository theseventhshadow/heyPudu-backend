services:
  ms-auth:
    image: unalmaermitana/heypudu-ms-auth:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      AWS_REGION: ${AWS_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      DB_URL: ${DB_URL_AUTH}
      DB_USERNAME: ${DB_USERNAME_AUTH}
      DB_PASSWORD: ${DB_PASSWORD_AUTH}
      CLIENTS_USERS_BASE_URL: http://ms-users:8082
    ports:
      - "8081:8081"
    mem_limit: 400m
    networks:
      - heypudu-internal

  ms-users:
    image: unalmaermitana/heypudu-ms-users:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      AWS_REGION: ${AWS_REGION}
      COGNITO_USER_POOL_ID: ${COGNITO_USER_POOL_ID}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      DB_URL: ${DB_URL_USERS}
      DB_USERNAME: ${DB_USERNAME_USERS}
      DB_PASSWORD: ${DB_PASSWORD_USERS}
      CLIENTS_AUTH_BASE_URL: http://ms-auth:8081
      CLIENTS_POSTS_BASE_URL: http://ms-posts:8083
      S3_AVATARS_BUCKET: ${S3_AVATARS_BUCKET}
    ports:
      - "8082:8082"
    mem_limit: 400m
    networks:
      - heypudu-internal

  ms-posts:
    image: unalmaermitana/heypudu-ms-posts:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      AWS_REGION: ${AWS_REGION}
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      DB_URL: ${DB_URL_POSTS}
      DB_USERNAME: ${DB_USERNAME_POSTS}
      DB_PASSWORD: ${DB_PASSWORD_POSTS}
      CLIENTS_USERS_BASE_URL: http://ms-users:8082
      CLIENTS_INTERACTIONS_BASE_URL: http://ms-interactions:8084
      S3_AUDIO_BUCKET: ${S3_AUDIO_BUCKET}
      S3_COVERS_BUCKET: ${S3_COVERS_BUCKET}
    ports:
      - "8083:8083"
    mem_limit: 400m
    networks:
      - heypudu-internal

  ms-interactions:
    image: unalmaermitana/heypudu-ms-interactions:latest
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx160m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      DB_URL: ${DB_URL_INTERACTIONS}
      DB_USERNAME: ${DB_USERNAME_INTERACTIONS}
      DB_PASSWORD: ${DB_PASSWORD_INTERACTIONS}
      CLIENTS_POSTS_BASE_URL: http://ms-posts:8083
    ports:
      - "8084:8084"
    mem_limit: 400m
    networks:
      - heypudu-internal

networks:
  heypudu-internal:
    driver: bridge
