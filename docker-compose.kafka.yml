# ============================================================
# Kafka en modo KRaft (sin Zookeeper) para heyPudú!
#
#   docker compose -f docker-compose.kafka.yml up -d
#   docker compose -f docker-compose.kafka.yml logs -f kafka-init
#
# Kafka UI:  http://localhost:8090
#
# Bootstrap servers:
#   - desde el host / Kafka UI externa:  localhost:29092
#   - desde los contenedores:            kafka:9092
#
# El proyecto se llama igual que docker-compose.yml (heypudu-backend)
# para compartir la red por defecto y que ms-live resuelva "kafka".
#
# En la EC2 de Kafka este archivo se usa solo, con el listener EXTERNAL
# apuntando a la IP privada del broker (ver DESPLIEGUE-AWS.md).
# ============================================================

name: heypudu-backend

services:

  kafka:
    image: apache/kafka:3.9.1
    container_name: heypudu-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-MkU3OEVBNTcwNTJENDM2Qk}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Contenedor de un solo uso: declara el tópico con la configuración
  # acordada (3 particiones, RF=1, retención de 7 días) y termina.
  kafka-init:
    image: apache/kafka:3.9.1
    container_name: heypudu-kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_LIVE_EVENTS: heypudu.live.events
      KAFKA_TOPIC_PARTITIONS: 3
      KAFKA_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TOPIC_RETENTION_MS: 604800000
    entrypoint: ["bash", "/opt/kafka-init/init-topics.sh"]
    volumes:
      - ./kafka/init-topics.sh:/opt/kafka-init/init-topics.sh:ro

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: heypudu-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: heypudu-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"

volumes:
  kafka_data:
