spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heypudu?currentSchema=heypudu_users}
    username: ${DB_USERNAME:heypudu_users_user}
    password: ${DB_PASSWORD:devpassword}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID
          jwk-set-uri: https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID/.well-known/jwks.json

clients:
  auth:
    base-url: ${CLIENTS_AUTH_BASE_URL:http://localhost:8081}
  posts:
    enabled: ${CLIENTS_POSTS_ENABLED:false}
    base-url: ${CLIENTS_POSTS_BASE_URL:http://localhost:8083}

aws:
  s3:
    region: us-east-1
    avatars-bucket: heypudu-avatars-dev

logging:
  level:
    root: INFO
    com.heypudu.ms_users: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    org.springframework.web.client: DEBUG
    software.amazon.awssdk: INFO

management:
  endpoint:
    health:
      show-details: always