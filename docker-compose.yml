services:

  # ============================================================
  # Base de datos PostgreSQL compartida
  # Cada microservicio usa su propio esquema dentro de esta BD.
  # ============================================================
  postgres:
    image: postgres:16
    container_name: heypudu-postgres
    environment:
      POSTGRES_DB: heypudu
      POSTGRES_USER: heypudu_admin
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heypudu_admin -d heypudu"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Microservicios
  # ============================================================
  ms-auth:
    build: ./ms-auth
    container_name: heypudu-ms-auth
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/heypudu?currentSchema=heypudu_auth
      DB_USERNAME: heypudu_auth_user
      DB_PASSWORD: devpassword
      CLIENTS_USERS_BASE_URL: http://ms-users:8082
      AWS_REGION: us-east-1
      COGNITO_USER_POOL_ID: us-east-1_DEVPOOLID
    depends_on:
      postgres:
        condition: service_healthy

  ms-users:
    build: ./ms-users
    container_name: heypudu-ms-users
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/heypudu?currentSchema=heypudu_users
      DB_USERNAME: heypudu_users_user
      DB_PASSWORD: devpassword
      CLIENTS_AUTH_BASE_URL: http://ms-auth:8081
      CLIENTS_POSTS_BASE_URL: http://ms-posts:8083
      AWS_REGION: us-east-1
      S3_AVATARS_BUCKET: heypudu-avatars-dev
    depends_on:
      postgres:
        condition: service_healthy

  ms-posts:
    build: ./ms-posts
    container_name: heypudu-ms-posts
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/heypudu?currentSchema=heypudu_posts
      DB_USERNAME: heypudu_posts_user
      DB_PASSWORD: devpassword
      CLIENTS_USERS_BASE_URL: http://ms-users:8082
      CLIENTS_INTERACTIONS_BASE_URL: http://ms-interactions:8084
      AWS_REGION: us-east-1
      S3_AUDIO_BUCKET: heypudu-audio-dev
      S3_COVERS_BUCKET: heypudu-covers-dev
    depends_on:
      postgres:
        condition: service_healthy

  ms-interactions:
    build: ./ms-interactions
    container_name: heypudu-ms-interactions
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/heypudu?currentSchema=heypudu_interactions
      DB_USERNAME: heypudu_interactions_user
      DB_PASSWORD: devpassword
      CLIENTS_POSTS_BASE_URL: http://ms-posts:8083
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: