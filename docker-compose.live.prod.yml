# ============================================================
# heyPudú! — EC2 3 (fase 8): Kafka + MediaMTX + ms-live + ms-analytics
#
#   cp live-prod.env.example live-prod.env   # completar valores
#   docker compose --env-file live-prod.env -f docker-compose.live.prod.yml up -d
#
# Solo usa imágenes ya publicadas en Docker Hub (no hace falta buildx en la EC2).
#
# Puertos publicados:
#   - 80/443   Caddy (TLS para WHIP/WHEP) -> mediamtx:8889
#   - 8889     interno (solo Caddy)
#   - 8189/udp medios WebRTC (ICE) directo al navegador
#   - 9997     API de control, sin publicar
#   - 8086/8087 ms-live / ms-analytics, solo accesibles desde el SG del ALB
#   - 2181/9092 ZooKeeper y Kafka, solo dentro de la red Docker
#
# Kafka corre en modo ZooKeeper con dos brokers (RF=2). Requiere una
# instancia con al menos 3,5 GB de RAM (t3.medium), no cabe en t3.small.
# ============================================================

name: heypudu-live

services:

  # ---------- Kafka con ZooKeeper + 2 brokers ----------
  # Kafka 4.x retiró ZooKeeper: las imágenes quedan fijadas en la línea 7.9
  # (Kafka 3.9) a propósito para mantener el modo ZooKeeper.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.9.0
    container_name: heypudu-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: -Xms128m -Xmx256m
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD", "cub", "zk-ready", "localhost", "2181", "5"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    mem_limit: 384m
    networks:
      - live-internal

  broker1:
    image: confluentinc/cp-kafka:7.9.0
    container_name: heypudu-broker1
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker1:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - broker1_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    mem_limit: 700m
    networks:
      - live-internal

  broker2:
    image: confluentinc/cp-kafka:7.9.0
    container_name: heypudu-broker2
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://broker2:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "2"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "2"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx384m
    volumes:
      - broker2_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    mem_limit: 700m
    networks:
      - live-internal

  kafka-init:
    image: confluentinc/cp-kafka:7.9.0
    container_name: heypudu-kafka-init
    restart: "no"
    depends_on:
      broker1:
        condition: service_healthy
      broker2:
        condition: service_healthy
    volumes:
      - ./kafka/init-topics.sh:/init-topics.sh:ro
    entrypoint: ["/bin/bash", "/init-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092
      KAFKA_TOPIC_LIVE_EVENTS: ${KAFKA_TOPIC_LIVE_EVENTS:-heypudu.live.events}
      KAFKA_TOPIC_POSTS_EVENTS: ${KAFKA_TOPIC_POSTS_EVENTS:-heypudu.posts.events}
      KAFKA_TOPIC_PARTITIONS: "3"
      KAFKA_TOPIC_POSTS_PARTITIONS: "2"
      KAFKA_TOPIC_REPLICATION_FACTOR: "2"
      KAFKA_TOPIC_RETENTION_MS: "604800000"
      KAFKA_TOPIC_POSTS_RETENTION_MS: "259200000"
      KAFKA_TOPIC_MIN_INSYNC_REPLICAS: "1"
    mem_limit: 256m
    networks:
      - live-internal

  mediamtx:
    # Se construye y publica desde la máquina local (ver §17.4) para que la
    # EC2 no necesite buildx:  docker build -t unalmaermitana/heypudu-mediamtx:latest ./mediamtx
    image: unalmaermitana/heypudu-mediamtx:latest
    container_name: heypudu-mediamtx
    restart: unless-stopped
    environment:
      MEDIAMTX_HOST: ${MEDIAMTX_HOST}
      MEDIAMTX_SERVICE_TOKEN: ${MEDIAMTX_SERVICE_TOKEN}
      MEDIAMTX_ALLOWED_ORIGIN: ${MEDIAMTX_ALLOWED_ORIGIN:-https://heypudu.vercel.app}
    volumes:
      # Se monta como plantilla: el entrypoint de la imagen aplica envsubst
      # y escribe /mediamtx.yml antes de arrancar.
      - ./mediamtx/mediamtx.prod.yml:/mediamtx.yml.template:ro
    expose:
      - "8889"
    ports:
      - "8189:8189/udp"
    mem_limit: 200m
    networks:
      - live-internal

  caddy:
    image: caddy:2-alpine
    container_name: heypudu-caddy
    restart: unless-stopped
    depends_on:
      - mediamtx
    environment:
      MEDIAMTX_HOST: ${MEDIAMTX_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    mem_limit: 100m
    networks:
      - live-internal

  ms-live:
    image: unalmaermitana/heypudu-ms-live:latest
    container_name: heypudu-ms-live
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx224m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      DB_URL: ${DB_URL_LIVE}
      DB_USERNAME: ${DB_USERNAME_LIVE}
      DB_PASSWORD: ${DB_PASSWORD_LIVE}
      CLIENTS_USERS_BASE_URL: ${CLIENTS_USERS_BASE_URL}
      KAFKA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092
      KAFKA_TOPIC_LIVE_EVENTS: ${KAFKA_TOPIC_LIVE_EVENTS:-heypudu.live.events}
      RABBITMQ_HOST: ${RABBITMQ_HOST}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MEDIAMTX_PUBLIC_URL: ${MEDIAMTX_PUBLIC_URL}
      MEDIAMTX_SERVICE_TOKEN: ${MEDIAMTX_SERVICE_TOKEN}
    ports:
      - "8086:8086"
    mem_limit: 450m
    networks:
      - live-internal

  ms-analytics:
    image: unalmaermitana/heypudu-ms-analytics:latest
    container_name: heypudu-ms-analytics
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx192m -Xss512k -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError
      COGNITO_ISSUER_URI: ${COGNITO_ISSUER_URI}
      COGNITO_JWK_SET_URI: ${COGNITO_JWK_SET_URI}
      KAFKA_BOOTSTRAP_SERVERS: broker1:9092,broker2:9092
      KAFKA_TOPIC_LIVE_EVENTS: ${KAFKA_TOPIC_LIVE_EVENTS:-heypudu.live.events}
      KAFKA_CONSUMER_GROUP: live-analytics-group
      KAFKA_AUDIT_GROUP: live-audit-group
      DB_URL: ${DB_URL_ANALYTICS}
      DB_USERNAME: ${DB_USERNAME_ANALYTICS}
      DB_PASSWORD: ${DB_PASSWORD_ANALYTICS}
    ports:
      - "8087:8087"
    mem_limit: 350m
    networks:
      - live-internal

networks:
  live-internal:
    driver: bridge

volumes:
  zookeeper_data:
  zookeeper_log:
  broker1_data:
  broker2_data:
  caddy_data:
  caddy_config:
