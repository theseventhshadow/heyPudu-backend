spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/heypudu?currentSchema=heypudu_live}
    username: ${DB_USERNAME:heypudu_live_user}
    password: ${DB_PASSWORD:devpassword}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COGNITO_ISSUER_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID}
          jwk-set-uri: ${COGNITO_JWK_SET_URI:https://cognito-idp.us-east-1.amazonaws.com/us-east-1_DEVPOOLID/.well-known/jwks.json}

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.web.client: DEBUG
